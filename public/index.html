<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge · Where code lives</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ea580c' d='M1.5 5.5H22v3.5c0 .6-.4 1-1 1h-5c-.6.5-.8 1.2-.8 2H18V14.5H7.5V12H10c0-1.3-1-2-2.5-2.2C4.7 9.4 2.8 7.8 1.5 5.5zM5.5 16h13v3h-13z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="bar">
<a class="logo" href="#/"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff6b1a"/><stop offset="1" stop-color="#d9480f"/></linearGradient></defs><path fill="url(#ag)" d="M1.5 5.5H22v3.5c0 .6-.4 1-1 1h-5c-.6.5-.8 1.2-.8 2H18V14.5H7.5V12H10c0-1.3-1-2-2.5-2.2C4.7 9.4 2.8 7.8 1.5 5.5zM5.5 16h13v3h-13z"/></svg>Forge</a>
<input id="gs" class="field" style="max-width:280px" placeholder="Search repositories" aria-label="Search repositories">
<span class="sp"></span>
<span id="acct" style="display:flex;gap:8px;align-items:center"></span>
<button class="btn" id="th" aria-label="Toggle theme"><span aria-hidden="true">◐</span><span class="lbl">Theme</span></button>
<button class="btn p" id="new" aria-label="New repository"><span aria-hidden="true">+</span><span class="lbl">New repository</span></button>
</div></header>
<main id="app"></main>
<footer>Forge · a small, extensible home for git repositories</footer>

<dialog id="dlg"><form method="dialog">
<h3>Create a new repository</h3>
<label for="rn">Name</label><input id="rn" class="field" placeholder="my-project">
<label for="rd">Description</label><input id="rd" class="field" placeholder="What does it do?">
<p id="re" class="err"></p>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
<button class="btn" type="button" id="rc">Cancel</button>
<button class="btn p" type="submit">Create repository</button></div>
</form></dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
